volumes:
  etc_amnezia_wg:

services:
  amnezia-wg-easy:
    image: ghcr.io/wowly/amnezia-wg-easy:latest
#ghcr.io/imbtqd/amnezia-wg-easy:latest
    container_name: amnezia-wg-easy
    env_file: .env
    volumes:
      - etc_amnezia_wg:/etc/amnezia/amneziawg
    ports:
      - "${WG_PORT}:${WG_PORT}/udp"
      - "${PORT}:${PORT}/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    devices:
      - /dev/net/tun:/dev/net/tun