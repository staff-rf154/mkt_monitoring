# global config
global:
  scrape_interval: 45s # Set the scrape interval to every 45 seconds. Default is every 1 minute.
  scrape_timeout: 30s
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  external_labels:
    origin_prometheus: mktxp

# Alertmanager configuration
alerting:
  alertmanagers:
  - scheme: http
    static_configs:
    - targets:
      - "alertmanager:9093"

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
#  - 'microtik.rules'
  - 'alerts.rules'

scrape_configs:
#  - job_name: 'adguard'
#    static_configs:
#      - targets: ['10.54.1.94:9618']
    # Windows-серверы (через windows_exporter)

#  - job_name: 'Windows'         # Лучше объединить в одну группу с метками
#    static_configs:
#      - targets:
#          - '10.54.5.252:9182'  # SRV-R7
#          - '10.54.5.5:9182'    # SRV-DC02
#          - '10.54.5.100:9151'  # SRV-KIB01
#        labels:
#          env: 'production'
#          os: 'windows'

  - job_name: node
    scrape_interval: 5s
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'amnezia-wg-easy'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['172.54.0.2:51821']
        labels:
          host: 'amnezia-wg-easy'
  - job_name: 'amnezia-wg-easy2'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['amnezia-wg-easy2:51821']
        labels:
          host: 'amnezia-wg-easy2'

  - job_name: 'grafana'
    static_configs:
    - targets: ['grafana:3000']

  - job_name: 'loki'
    static_configs:
    - targets: ['loki:3100']

  - job_name: 'promtail'
    static_configs:
    - targets: ['promtail:9080']

  - job_name: 'mktxp'
    scrape_interval: 60s
    scrape_timeout: 55s
    static_configs:
      - targets: ['mktxp:49090']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
  
  - job_name: 'blackbox'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [icmp_ttl5]   # use ICMP as the ping protocol
    static_configs:
      - targets:
        - 1.1.1.1     # Cloudflare DNS
        - 77.88.8.8   # Yandex DNS
    # Микротики опрашиваются отдельно, в job mikrotik_ping ниже: у ICMP-целей
    # нет лейблов routerboard_name/routerboard_address, которые добавляет MKTXP,
    # а без них уведомление о недоступности приходит с пустым именем.
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115  # The blackbox exporter's real hostname:port.

  - job_name: 'mikrotik_ping'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [icmp_ttl5]
    static_configs:
      - targets:
        - 10.54.1.254    # Router-1
        - 172.54.1.10    # Router-1-2
        - 10.54.2.254    # Router-2
        - 10.54.3.254    # Router-3
    # routerboard_name проставляется через regex-замены по адресу, чтобы
    # алерты в Telegram показывали читаемое имя устройства.
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        target_label: routerboard_address
      - source_labels: [routerboard_address]
        regex: '10\.54\.1\.254'
        target_label: routerboard_name
        replacement: 'Router-1'
      - source_labels: [routerboard_address]
        regex: '172\.54\.1\.10'
        target_label: routerboard_name
        replacement: 'Router-1-2'
      - source_labels: [routerboard_address]
        regex: '10\.54\.2\.254'
        target_label: routerboard_name
        replacement: 'Router-2'
      - source_labels: [routerboard_address]
        regex: '10\.54\.3\.254'
        target_label: routerboard_name
        replacement: 'Router-3'
      - target_label: __address__
        replacement: blackbox:9115
