# global config
global:
  scrape_interval: 45s # Set the scrape interval to every 45 seconds. Default is every 1 minute.
  scrape_timeout: 30s
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  external_labels:
    origin_prometheus: mktxp

# Alertmanager configuration
alerting:
  alertmanagers:
  - scheme: http
    static_configs:
    - targets:
      - "alertmanager:9093"

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
#  - 'microtik.rules'
  - 'alerts.rules'

scrape_configs:
#  - job_name: 'adguard'
#    static_configs:
#      - targets: ['10.54.1.94:9618']
    # Windows-серверы (через windows_exporter)

#  - job_name: 'Windows'         # Лучше объединить в одну группу с метками
#    static_configs:
#      - targets:
#          - '10.54.5.252:9182'  # SRV-R7
#          - '10.54.5.5:9182'    # SRV-DC02
#          - '10.54.5.100:9151'  # SRV-KIB01
#        labels:
#          env: 'production'
#          os: 'windows'

  - job_name: node
    scrape_interval: 5s
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'amnezia-wg-easy'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['172.54.0.2:51821']
        labels:
          host: 'amnezia-wg-easy'
  - job_name: 'amnezia-wg-easy2'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['amnezia-wg-easy2:51821']
        labels:
          host: 'amnezia-wg-easy2'

  - job_name: 'grafana'
    static_configs:
    - targets: ['grafana:3000']

  - job_name: 'loki'
    static_configs:
    - targets: ['loki:3100']

  - job_name: 'promtail'
    static_configs:
    - targets: ['promtail:9080']

  - job_name: 'mktxp'
    static_configs:
      - targets: ['mktxp:49090']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'blackbox'
    scrape_interval: 1s
    metrics_path: /probe
    params:
      module: [icmp_ttl5]   # use ICMP as the ping protocol
    static_configs:
      - targets:
        - 1.1.1.1     # Cloudflare DNS
        - 10.54.1.254     # Local DNS
        - 77.88.8.8   # Yandex DNS
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115  # The blackbox exporter's real hostname:port.
