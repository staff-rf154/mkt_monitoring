[default]
    enabled = True
    hostname = localhost
    port = 8728
    username = prometheus
    credentials_file = /root/mktxp/credentials.yml
    use_ssl = False
    plaintext_login = True
    timeout = 30
    log_level = DEBUG
    
    # Отключаем проблемные модули
    route = True
    routing_stats = True
    health = True
    wireless = True
    lte = True
    bgp = True
    eoip = True
    ipip = True
    ipsec = True
    poe = True
    netwatch = True
    public_ip = True
    switch_port = True
    user = True
    queue = True
    certificate = False
    check_for_updates = True
    installed_packages = True
    capsman = True
    kid_control_assigned = True
    kid_control_dynamic = True
    # Включаем только основное
    interface = True
    firewall = True
    dhcp = True
    monitor = True
    connections = True
    pool = True
    neighbor = True
    dns = True
    dhcp_lease = True

[Router-1]
    hostname = 10.54.1.254

[Router-1-2]
    hostname = 172.54.1.10

[Router-2]
    hostname = 10.54.2.254
    timeout = 45

[Router-3]
    hostname = 10.54.3.254
    timeout = 45

# The section below contains the latest default parameters introduced by MKTXP
# For organizational purposes, you can move these parameters to the [default] section
[new_default_parameters]
    bfd = True
    ipv6_neighbor = True
    module_only = False
    bridge_vlan = True
    ssl_certificate_verify = False
    gre = True
    ssl_check_hostname = True
    routerboard = True
    ipv6_firewall = True
    capsman_clients = True
    ipv6_pool = True
    connection_stats = True
    wireless_clients = True
    ipv6_route = True
    wireguard_peers = True
    container = True
    no_ssl_certificate = False
    w60g = False
    connection_stats_destinations = True
    credentials_file = ""
    ssl_ca_file = ""
    remote_dhcp_entry = None
    remote_capsman_entry = None
    address_list = True
    ipv6_address_list = True
    custom_labels = None
    interface_name_format = name
    total_address_list_counts = True
    ipv6_total_address_list_counts = True
    interface_with_default_name = False
    password = password
